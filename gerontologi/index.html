<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>Gerontologinen hoitoty&ouml; &mdash; &Ccedil;al&#305;&#351;malar</title>
<style>
  :root { --bg:#0f172a; --card-bg:#1e293b; --primary:#0d9488; --primary-hover:#14b8a6; --accent:#38bdf8; --text:#f8fafc; --text-muted:#94a3b8; --danger:#ef4444; --border:#334155; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px -5px rgba(0,0,0,.5); text-align: center; }
  .lock-icon { width: 56px; height: 56px; background: #0369a122; border: 1px solid #38bdf844; color: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; font-size: 26px; }
  h1 { font-size: 19px; font-weight: 800; margin-bottom: 6px; color: #f1f5f9; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.4; }
  .input-group { margin-bottom: 16px; text-align: left; }
  label { display: block; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  input[type="password"] { width: 100%; padding: 13px 14px; background: #090d16; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 16px; outline: none; }
  input[type="password"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56,189,248,.25); }
  .remember-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 13px; color: var(--text-muted); cursor: pointer; user-select: none; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .remember-wrap input { accent-color: var(--primary); width: 16px; height: 16px; }
  .btn-submit { width: 100%; padding: 13px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-submit:hover { background: var(--primary-hover); }
  .error-msg { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 12px; display: none; line-height: 1.4; }
  .status-msg { color: var(--accent); font-size: 13px; font-weight: 600; margin-top: 12px; display: none; }
  .footer-hint { margin-top: 20px; font-size: 11px; color: #64748b; }
</style>
</head>
<body>

<div class="login-card" id="loginCard">
  <div class="lock-icon">&#128274;</div>
  <h1>Gerontologinen hoitoty&ouml;</h1>
  <div class="subtitle">&Ouml;zel &Ccedil;al&#305;&#351;ma Portal&#305;</div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="input-group">
      <label for="pwdInput">Ki&#351;isel Giri&#351; &#350;ifresi</label>
      <div style="position:relative; display:flex; align-items:center;">
        <input type="password" id="pwdInput" placeholder="&#350;ifrenizi giriniz..." autocomplete="current-password" autofocus required style="padding-right:44px;">
        <button type="button" id="btnTogglePwd" onclick="togglePasswordVisibility()" style="position:absolute; right:10px; background:none; border:none; cursor:pointer; font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center; padding:4px;" title="&#350;ifreyi G&#246;ster / Gizle">
          &#x1F441;&#xFE0F;
        </button>
      </div>
      <div style="font-size: 11.5px; color: #94a3b8; margin-top: 6px; line-height: 1.35;">
        &#x2139;&#xFE0F; Kullan&#305;c&#305; ad&#305; gerekmez. Sistem &#351;ifrenizden profilinizi otomatik tan&#305;r.
      </div>
    </div>
    <label class="remember-wrap">
      <input type="checkbox" id="rememberMe" checked>
      <span>Beni bu cihazda hat&#305;rla (tekrar sorma)</span>
    </label>
    <button type="submit" class="btn-submit" id="btnSubmit"><span>Giri&#351; Yap</span> &rarr;</button>
    <div class="status-msg" id="statusMsg"></div>
    <div class="error-msg" id="errorMsg">&#350;ifre hatal&#305;! L&uuml;tfen kontrol ediniz.</div>
  </form>

  <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid #334155; font-size: 12px;">
    <a href="javascript:void(0)" onclick="clearDeviceSession()" style="color:#f87171;text-decoration:underline;">
      &#x1F9F9; Bu cihazdaki kay&#305;tl&#305; oturumu temizle
    </a>
  </div>

  <div class="footer-hint" style="display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap;">
    <span>Tasar&#305;m: <strong>By Hkn</strong> &mdash; Allah raz&#305; olsun &#x1F932;</span>
    <button type="button" id="btn-fullscreen" onclick="toggleFullScreen()" style="background:rgba(56, 189, 248, 0.12); border:1px solid rgba(56, 189, 248, 0.4); color:#38bdf8; border-radius:6px; padding:3px 7px; font-size:13px; line-height:1; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:0.2s;" title="Tam Ekran"><span id="fs-icon">&#x26F6;</span></button>
  </div>
</div>

  function b64(s) {
    const bin = atob(s); const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  async function tryDecryptSlot(slot, password) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const wrapKey = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(slot.s), iterations: 150000, hash: 'SHA-256' },
      km, { name: 'AES-CBC', length: 256 }, false, ['decrypt']);
    const raw = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(slot.i) }, wrapKey, b64(slot.k));
    const contentKey = await crypto.subtle.importKey('raw', raw, { name: 'AES-CBC' }, false, ['decrypt']);
    const dec = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(IV_B64) }, contentKey, b64(CIPHER_B64));
    return new TextDecoder().decode(dec);
  }

  async function tryUnlockWithPassword(password, save) {
    const errorMsg = document.getElementById('errorMsg');
    const statusMsg = document.getElementById('statusMsg');
    const btn = document.getElementById('btnSubmit');

    if (!password) {
      errorMsg.textContent = 'Lütfen şifrenizi giriniz.';
      errorMsg.style.display = 'block';
      return;
    }

    let matchedUser = null;
    let decryptedHtml = null;

    try {
      btn.disabled = true;
      btn.innerText = 'Doğrulanıyor...';
      if (statusMsg) {
        statusMsg.style.display = 'block';
        statusMsg.innerText = 'Şifre kontrol ediliyor ve içerik çözülüyor...';
      }
      errorMsg.style.display = 'none';

      const userKeys = Object.keys(USERS);
      for (const u of userKeys) {
        try {
          const html = await tryDecryptSlot(USERS[u], password);
          matchedUser = u;
          decryptedHtml = html;
          break;
        } catch (e) {
          // not this user, continue
        }
      }

      if (!matchedUser || !decryptedHtml) {
        throw new Error('Hatalı şifre');
      }

      // Authentication SUCCESS! Store session token
      localStorage.setItem('portal_user', matchedUser);
      if (save) {
        localStorage.setItem('portal_auth_token', password);
      } else {
        localStorage.removeItem('portal_auth_token');
      }

      if (statusMsg) {
        const uLabel = (matchedUser === 'shyl' ? 'shyl' : 'hkn');
        statusMsg.innerText = 'Giriş başarılı! Hoş geldiniz (' + uLabel + ')...';
      }
    } catch (authErr) {
      console.error(authErr);
      localStorage.removeItem('portal_auth_token');
      if (statusMsg) statusMsg.style.display = 'none';
      errorMsg.textContent = 'Şifre hatalı! Lütfen kişisel çalışma şifrenizi kontrol ediniz.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<span>Giriş Yap</span> &rarr;';
      const pwd = document.getElementById('pwdInput');
      if (pwd) { pwd.focus(); pwd.select(); }
      return;
    }

    // Render decrypted HTML directly into page
    try {
      const parser = new DOMParser();
      const newDoc = parser.parseFromString(decryptedHtml, 'text/html');
      const scripts = Array.from(newDoc.querySelectorAll('script'));
      scripts.forEach(s => s.remove());

      document.title = newDoc.title;
      document.head.innerHTML = newDoc.head.innerHTML;
      document.body.innerHTML = newDoc.body.innerHTML;

      scripts.forEach(s => {
        const sc = document.createElement('script');
        if (s.src) sc.src = s.src;
        else sc.textContent = s.textContent;
        document.body.appendChild(sc);
      });
    } catch (renderErr) {
      console.error('Render error:', renderErr);
    }
  }


  function togglePasswordVisibility() {
    const pwd = document.getElementById('pwdInput');
    const btn = document.getElementById('btnTogglePwd');
    if (!pwd || !btn) return;
    if (pwd.type === 'password') {
      pwd.type = 'text';
      btn.innerHTML = '&#x1F648;';
      btn.title = 'Şifreyi Gizle';
    } else {
      pwd.type = 'password';
      btn.innerHTML = '&#x1F441;&#xFE0F;';
      btn.title = 'Şifreyi Göster';
    }
    pwd.focus();
  }

  function handleLogin(e) {
    e.preventDefault();
    const pwd = document.getElementById('pwdInput').value;
    const save = document.getElementById('rememberMe').checked;
    tryUnlockWithPassword(pwd, save);
  }

  function clearDeviceSession() {
    localStorage.removeItem('portal_auth_token');
    localStorage.removeItem('portal_user');
    const pwd = document.getElementById('pwdInput');
    if (pwd) pwd.value = '';
    alert('Bu cihazdaki kay\u0131tl\u0131 \u015fifre ve a\u00e7\u0131k oturum temizlendi.');
  }

  window.addEventListener('DOMContentLoaded', () => {
    // Check if logout was requested via query param
    const p = new URLSearchParams(window.location.search);
    if (p.has('logout')) {
      localStorage.removeItem('portal_auth_token');
      localStorage.removeItem('portal_user');
      try {
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch (e) {}
      return;
    }

    const savedToken = localStorage.getItem('portal_auth_token');
    if (savedToken) {
      const pwd = document.getElementById('pwdInput');
      if (pwd) pwd.value = savedToken;
      tryUnlockWithPassword(savedToken, true);
    }
  });

  function toggleFullScreen() {
    var doc = window.document;
    var docEl = doc.documentElement;
    var requestFS = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
    var exitFS = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
    var isFS = doc.fullscreenElement || doc.mozFullScreenElement || doc.webkitFullscreenElement || doc.msFullscreenElement;

    if (!isFS) {
      if (requestFS) requestFS.call(docEl).catch(function(e) {});
    } else {
      if (exitFS) exitFS.call(doc).catch(function(e) {});
    }
  }

  function updateFullscreenButtonState() {
    var doc = window.document;
    var isFS = doc.fullscreenElement || doc.mozFullScreenElement || doc.webkitFullscreenElement || doc.msFullscreenElement;
    var icon = document.getElementById('fs-icon');
    var btn = document.getElementById('btn-fullscreen');
    if (isFS) {
      if (icon) icon.innerHTML = '&#x1F5D7;';
      if (btn) { btn.style.borderColor = '#10b981'; btn.style.color = '#34d399'; btn.title = 'Normale Dön'; }
    } else {
      if (icon) icon.innerHTML = '&#x26F6;';
      if (btn) { btn.style.borderColor = 'rgba(56, 189, 248, 0.4)'; btn.style.color = '#38bdf8'; btn.title = 'Tam Ekran'; }
    }
  }

  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function(evt) {
    document.addEventListener(evt, updateFullscreenButtonState);
  });

</script>
