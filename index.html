<style>
  :root { --bg:#0f172a; --card-bg:#1e293b; --primary:#0d9488; --primary-hover:#14b8a6; --accent:#38bdf8; --text:#f8fafc; --text-muted:#94a3b8; --danger:#ef4444; --border:#334155; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px -5px rgba(0,0,0,.5); text-align: center; }
  .lock-icon { width: 56px; height: 56px; background: #0369a122; border: 1px solid #38bdf844; color: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; font-size: 26px; }
  h1 { font-size: 19px; font-weight: 800; margin-bottom: 6px; color: #f1f5f9; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.4; }
  .input-group { margin-bottom: 16px; text-align: left; }
  label { display: block; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  input[type="password"] { width: 100%; padding: 13px 14px; background: #090d16; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 16px; outline: none; }
  input[type="password"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56,189,248,.25); }
  .remember-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 13px; color: var(--text-muted); cursor: pointer; user-select: none; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .remember-wrap input { accent-color: var(--primary); width: 16px; height: 16px; }
  .btn-submit { width: 100%; padding: 13px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-submit:hover { background: var(--primary-hover); }
  .error-msg { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 12px; display: none; line-height: 1.4; }
  .status-msg { color: var(--accent); font-size: 13px; font-weight: 600; margin-top: 12px; display: none; }
  .footer-hint { margin-top: 20px; font-size: 11px; color: #64748b; }
</style>

<div class="login-card" id="loginCard">

  async function tryDecryptSlot(slot, password) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const wrapKey = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(slot.s), iterations: 150000, hash: 'SHA-256' },
      km, { name: 'AES-CBC', length: 256 }, false, ['decrypt']);
    const raw = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(slot.i) }, wrapKey, b64(slot.k));
    const contentKey = await crypto.subtle.importKey('raw', raw, { name: 'AES-CBC' }, false, ['decrypt']);
    const dec = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(IV_B64) }, contentKey, b64(CIPHER_B64));
    return new TextDecoder().decode(dec);
  }

  async function tryUnlockWithPassword(password, save) {
    const errorMsg = document.getElementById('errorMsg');
    const statusMsg = document.getElementById('statusMsg');
    const btn = document.getElementById('btnSubmit');

    password = (password || '').trim();
    if (!password) {
      errorMsg.textContent = 'L\u00fctfen \u015fifrenizi giriniz.';
      errorMsg.style.display = 'block';
      return;
    }

    try {
      btn.disabled = true;
      btn.innerText = 'Do\u011frulan\u0131yor...';
      if (statusMsg) {
        statusMsg.style.display = 'block';
        statusMsg.innerText = '\u015eifre kontrol ediliyor ve i\u00e7erik \u00e7\u00f6z\u00fcl\u00fcyor...';
      }
      errorMsg.style.display = 'none';

      let matchedUser = null;
      let decryptedHtml = null;

      const userKeys = Object.keys(USERS);
      for (const u of userKeys) {
        try {
          const html = await tryDecryptSlot(USERS[u], password);
          matchedUser = u;
          decryptedHtml = html;
          break;
        } catch (e) {
          // not this user, continue
        }
      }

      if (!matchedUser || !decryptedHtml) {
        throw new Error('Hatal\u0131 \u015fifre');
      }

      localStorage.setItem('portal_user', matchedUser);
      if (save) {
        localStorage.setItem('portal_auth_token', password);
      } else {
        localStorage.removeItem('portal_auth_token');
      }

      if (statusMsg) {
        const uLabel = (matchedUser === 'hkn' ? 'Hakan' : (matchedUser === 'shyl' ? 'Shyl' : matchedUser));
        statusMsg.innerText = 'Giri\u015f ba\u015far\u0131l\u0131! Ho\u015f geldiniz (' + uLabel + ')...';
      }

      const frame = document.getElementById('appFrame');
      frame.style.display = 'block';
      frame.contentDocument.open();
      frame.contentDocument.write(decryptedHtml);
      frame.contentDocument.close();
      document.getElementById('loginCard').style.display = 'none';
    } catch (e) {
      console.error(e);
      localStorage.removeItem('portal_auth_token');
      if (statusMsg) statusMsg.style.display = 'none';
      errorMsg.textContent = '\u015eifre hatal\u0131! L\u00fctfen ki\u015fisel \u00e7al\u0131\u015fma \u015fifrenizi kontrol ediniz.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<span>Giri\u015f Yap</span> &rarr;';
      const pwd = document.getElementById('pwdInput');
      pwd.focus();
      pwd.select();
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    const pwd = document.getElementById('pwdInput').value;
    const save = document.getElementById('rememberMe').checked;
    tryUnlockWithPassword(pwd, save);
  }

  function clearDeviceSession() {
    localStorage.removeItem('portal_auth_token');
    localStorage.removeItem('portal_user');
    const pwd = document.getElementById('pwdInput');
    if (pwd) pwd.value = '';
    alert('Bu cihazdaki kay\u0131tl\u0131 \u015fifre ve a\u00e7\u0131k oturum temizlendi.');
  }

  window.addEventListener('DOMContentLoaded', () => {
    // Check if logout was requested via query param
    const p = new URLSearchParams(window.location.search);
    if (p.has('logout')) {
      localStorage.removeItem('portal_auth_token');
      localStorage.removeItem('portal_user');
      try {
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch (e) {}
      return;
    }

    const savedToken = localStorage.getItem('portal_auth_token');
    if (savedToken) {
      const pwd = document.getElementById('pwdInput');
      if (pwd) pwd.value = savedToken;
      tryUnlockWithPassword(savedToken, true);
    }
  });
</script>
