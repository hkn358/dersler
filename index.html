<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mielenterveys- ja P&auml;ihdehoitoty&ouml; &mdash; &#199;al&#305;&#351;malar</title>
<style>
  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --primary: #0d9488;
    --primary-hover: #14b8a6;
    --accent: #38bdf8;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --danger: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .login-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    text-align: center;
  }
  .lock-icon {
    width: 56px;
    height: 56px;
    background: #0369a122;
    border: 1px solid #38bdf844;
    color: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px auto;
    font-size: 26px;
  }
  h1 {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 6px;
    color: #f1f5f9;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 22px;
    line-height: 1.4;
  }
  .input-group {
    margin-bottom: 16px;
    text-align: left;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #cbd5e1;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    background: #090d16;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
  }
  .remember-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
  }
  .remember-wrap input {
    accent-color: var(--primary);
    width: 16px;
    height: 16px;
  }
  .btn-submit {
    width: 100%;
    padding: 13px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-submit:hover {
    background: var(--primary-hover);
  }
  .btn-submit:active {
    transform: scale(0.98);
  }
  .error-msg {
    color: var(--danger);
    font-size: 13px;
    font-weight: 600;
    margin-top: 12px;
    display: none;
    animation: shake 0.35s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .footer-hint {
    margin-top: 20px;
    font-size: 11px;
    color: #64748b;
  }
</style>
</head>
<body>

<div class="login-card" id="loginCard">
  <div class="lock-icon">&#128274;</div>
  <h1>Mielenterveys &amp; P&auml;ihdehoitoty&ouml;</h1>
  <div class="subtitle">&#214;zel &#199;al&#305;&#351;ma Portali<br><span style="color: #38bdf8; font-size: 12px;">AES-256 Kripto Z&#305;rh&#305; ile Korunmaktad&#305;r</span></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="input-group">
      <label for="pwdInput">Portal Giri&#351; &#350;ifresi</label>
      <input type="password" id="pwdInput" placeholder="&#350;ifrenizi giriniz..." autocomplete="current-password" required autofocus>
    </div>

    <label class="remember-wrap">
      <input type="checkbox" id="rememberMe" checked>
      <span>Beni bu cihazda hat&#305;rla (tekrar sorma)</span>
    </label>

    <button type="submit" class="btn-submit" id="btnSubmit">
      <span>Giri&#351; Yap &amp; &#199;al&#305;&#351;maya Ba&#351;la</span> &rarr;
    </button>

    <div class="error-msg" id="errorMsg">Hatal&#305; &#351;ifre! L&uuml;tfen tekrar deneyiniz.</div>
  </form>

  <div class="footer-hint">Tasar&#305;m: <strong>Hakan Kar&#351;&#305;yakal&#305;</strong> &mdash; Allah raz&#305; olsun &#x1F932;</div>
</div>

  function b64ToUint8(b64) {
    const bin = atob(b64);
    const len = bin.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function decryptData(password) {
    const enc = new TextEncoder();
    const pwKey = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveKey']
    );

    const salt = b64ToUint8(SALT_B64);
    const iv = b64ToUint8(IV_B64);
    const cipher = b64ToUint8(CIPHER_B64);

    const key = await crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: salt,
        iterations: 100000,
        hash: 'SHA-1'
      },
      pwKey,
      { name: 'AES-CBC', length: 256 },
      false,
      ['decrypt']
    );

    const dec = await crypto.subtle.decrypt(
      { name: 'AES-CBC', iv: iv },
      key,
      cipher
    );

    return new TextDecoder().decode(dec);
  }

  async function tryUnlock(password, save) {
    const errorMsg = document.getElementById('errorMsg');
    const btn = document.getElementById('btnSubmit');
    try {
      btn.innerText = 'Zırh Çözülüyor...';
      btn.disabled = true;
      errorMsg.style.display = 'none';

      const html = await decryptData(password);
      if (save) {
        localStorage.setItem('hamk_auth_token', password);
      }
      const frame = document.getElementById('appFrame');
      frame.style.display = 'block';
      frame.contentDocument.open();
      frame.contentDocument.write(html);
      frame.contentDocument.close();
      document.getElementById('loginCard').style.display = 'none';
    } catch (e) {
      console.error(e);
      errorMsg.style.display = 'block';
      btn.innerHTML = '<span>Giriş Yap &amp; Çalışmaya Başla</span> &rarr;';
      btn.disabled = false;
      document.getElementById('pwdInput').focus();
      document.getElementById('pwdInput').select();
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    const pwd = document.getElementById('pwdInput').value;
    const remember = document.getElementById('rememberMe').checked;
    tryUnlock(pwd, remember);
  }

  // Auto-login if previously remembered
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('hamk_auth_token');
    if (saved) {
      document.getElementById('pwdInput').value = saved;
      tryUnlock(saved, true);
    }
  });
</script>
