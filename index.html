<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mielenterveys- ja P&auml;ihdehoitoty&ouml; &mdash; &Ccedil;al&#305;&#351;malar</title>
<style>
  :root { --bg:#0f172a; --card-bg:#1e293b; --primary:#0d9488; --primary-hover:#14b8a6; --accent:#38bdf8; --text:#f8fafc; --text-muted:#94a3b8; --danger:#ef4444; --border:#334155; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px -5px rgba(0,0,0,.5); text-align: center; }
  .lock-icon { width: 56px; height: 56px; background: #0369a122; border: 1px solid #38bdf844; color: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; font-size: 26px; }
  h1 { font-size: 19px; font-weight: 800; margin-bottom: 6px; color: #f1f5f9; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.4; }
  .input-group { margin-bottom: 16px; text-align: left; }
  label { display: block; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  input[type="password"], input[type="text"] { width: 100%; padding: 12px 14px; background: #090d16; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 16px; outline: none; }
  input[type="password"]:focus, input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56,189,248,.25); }
  .remember-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 13px; color: var(--text-muted); cursor: pointer; user-select: none; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .remember-wrap input { accent-color: var(--primary); width: 16px; height: 16px; }
  .btn-submit { width: 100%; padding: 13px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-submit:hover { background: var(--primary-hover); }
  .error-msg { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 12px; display: none; }
  .footer-hint { margin-top: 20px; font-size: 11px; color: #64748b; }
</style>
</head>
<body>

<div class="login-card" id="loginCard">
  <div class="lock-icon">&#128274;</div>
  <h1>Mielenterveys &amp; P&auml;ihdehoitoty&ouml;</h1>
  <div class="subtitle">&Ouml;zel &Ccedil;al&#305;&#351;ma Portal&#305;<br><span style="color:#38bdf8;font-size:12px;">AES-256 ile korunmaktad&#305;r</span></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="input-group">
      <label for="userInput">Kullan&#305;c&#305; Ad&#305;</label>
      <input type="text" id="userInput" placeholder="Kullan&#305;c&#305; ad&#305;n&#305;z" autocomplete="username" maxlength="30" autocapitalize="none" required>
    </div>
    <div class="input-group">
      <label for="pwdInput">&#350;ifre</label>
      <input type="password" id="pwdInput" placeholder="&#350;ifrenizi giriniz..." autocomplete="current-password" required>
    </div>
    <label class="remember-wrap">
      <input type="checkbox" id="rememberMe" checked>
      <span>Beni bu cihazda hat&#305;rla (tekrar sorma)</span>
    </label>
    <button type="submit" class="btn-submit" id="btnSubmit"><span>Giri&#351; Yap</span> &rarr;</button>
    <div class="error-msg" id="errorMsg">Kullan&#305;c&#305; ad&#305; veya &#351;ifre hatal&#305;!</div>
  </form>

  <div class="footer-hint">Tasar&#305;m: <strong>Hakan Kar&#351;&#305;yakal&#305;</strong> &mdash; Allah raz&#305; olsun &#x1F932;</div>
</div>

  function b64(s) {
    const bin = atob(s); const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function cleanUser(u) {
    return (u || '').toLowerCase().replace(/[^a-z0-9_.-]/g, '').slice(0, 30);
  }

  async function decryptApp(user, password) {
    const slot = USERS[user];
    if (!slot) throw new Error('unknown user');
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const wrapKey = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(slot.s), iterations: 150000, hash: 'SHA-256' },
      km, { name: 'AES-CBC', length: 256 }, false, ['decrypt']);
    const raw = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(slot.i) }, wrapKey, b64(slot.k));
    const contentKey = await crypto.subtle.importKey('raw', raw, { name: 'AES-CBC' }, false, ['decrypt']);
    const dec = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(IV_B64) }, contentKey, b64(CIPHER_B64));
    return new TextDecoder().decode(dec);
  }

  async function tryUnlock(user, password, save) {
    const errorMsg = document.getElementById('errorMsg');
    const btn = document.getElementById('btnSubmit');
    try {
      btn.disabled = true; btn.innerText = 'A\u00e7\u0131l\u0131yor...';
      errorMsg.style.display = 'none';
      user = cleanUser(user);
      const html = await decryptApp(user, password);
      localStorage.setItem('portal_user', user);
      if (save) localStorage.setItem('portal_auth_token', password);
      else localStorage.removeItem('portal_auth_token');
      const frame = document.getElementById('appFrame');
      frame.style.display = 'block';
      frame.contentDocument.open();
      frame.contentDocument.write(html);
      frame.contentDocument.close();
      document.getElementById('loginCard').style.display = 'none';
    } catch (e) {
      console.error(e);
      localStorage.removeItem('portal_auth_token');
      errorMsg.style.display = 'block';
      btn.disabled = false; btn.innerHTML = '<span>Giri\u015f Yap</span> &rarr;';
      document.getElementById('pwdInput').focus();
      document.getElementById('pwdInput').select();
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    tryUnlock(document.getElementById('userInput').value, document.getElementById('pwdInput').value, document.getElementById('rememberMe').checked);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const u = localStorage.getItem('portal_user');
    if (u) document.getElementById('userInput').value = u;
    const t = localStorage.getItem('portal_auth_token');
    if (u && t) {
      document.getElementById('pwdInput').value = t;
      tryUnlock(u, t, true);
    }
  });
</script>
