  function b64(s) {
    const bin = atob(s); const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  function getPortalBaseUrl() {
    try {
      const p = window.location.pathname;
      const idx = p.lastIndexOf('/dersler/');
      if (idx !== -1) return p.slice(0, idx + '/dersler/'.length);
    } catch (e) {}
    return '../';
  }

  function getCurrentCourseSlug() {
    try {
      const parts = window.location.pathname.split('/').filter(Boolean);
      let seg = parts[parts.length - 1] || '';
      if (seg.endsWith('.html') && parts.length >= 2) {
        seg = parts[parts.length - 2];
      }
      if (/^[a-z0-9_-]+$/i.test(seg) && seg !== 'dersler') {
        return seg.toLowerCase() + '/';
      }
    } catch (e) {}
    return '';
  }

  function redirectToMainLogin(isAuthError) {
    const base = getPortalBaseUrl();
    const nextSlug = getCurrentCourseSlug();
    const qs = [];
    if (nextSlug) qs.push('next=' + encodeURIComponent(nextSlug));
    if (isAuthError) qs.push('autherr=1');
    const targetUrl = base + (qs.length ? '?' + qs.join('&') : '');

    const link = document.getElementById('gateLoginLink');
    if (link) link.href = targetUrl;

    const spinner = document.getElementById('gateSpinner');
    const icon = document.getElementById('gateIcon');
    const title = document.getElementById('gateTitle');
    const sub = document.getElementById('gateSub');
    const actions = document.getElementById('gateActions');
    if (spinner) spinner.style.display = 'none';
    if (icon) icon.style.display = 'flex';
    if (title) title.textContent = 'Ana Giriş Gerekli';
    if (sub) sub.textContent = 'Tüm dersler için tek giriş noktası olan ana sayfaya yönlendiriliyorsunuz...';
    if (actions) actions.style.display = 'block';

    try {
      window.location.replace(targetUrl);
    } catch (e) {
      window.location.href = targetUrl;
    }
  }

  async function tryDecryptSlot(slot, password) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const wrapKey = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(slot.s), iterations: 150000, hash: 'SHA-256' },
      km, { name: 'AES-CBC', length: 256 }, false, ['decrypt']);
    const raw = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(slot.i) }, wrapKey, b64(slot.k));
    const contentKey = await crypto.subtle.importKey('raw', raw, { name: 'AES-CBC' }, false, ['decrypt']);
    const dec = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(IV_B64) }, contentKey, b64(CIPHER_B64));
    return new TextDecoder().decode(dec);
  }

  async function unlockCourseWithToken(password) {
    if (!password) {
      redirectToMainLogin(false);
      return;
    }

    let matchedUser = null;
    let decryptedHtml = null;

    const userKeys = Object.keys(USERS);
    for (const u of userKeys) {
      try {
        const html = await tryDecryptSlot(USERS[u], password);
        matchedUser = u;
        decryptedHtml = html;
        break;
      } catch (e) {
        // continue checking other slots
      }
    }

    if (!matchedUser || !decryptedHtml) {
      try {
        localStorage.removeItem('portal_auth_token');
        localStorage.removeItem('portal_user');
      } catch (e) {}
      redirectToMainLogin(true);
      return;
    }

    try {
      localStorage.setItem('portal_user', matchedUser);
      sessionStorage.setItem('portal_user', matchedUser);
    } catch (e) {}

    try {
      const parser = new DOMParser();
      const newDoc = parser.parseFromString(decryptedHtml, 'text/html');
      const scripts = Array.from(newDoc.querySelectorAll('script'));
      scripts.forEach(s => s.remove());

      document.title = newDoc.title;
      document.head.innerHTML = newDoc.head.innerHTML;
      document.body.innerHTML = newDoc.body.innerHTML;

      scripts.forEach(s => {
        const sc = document.createElement('script');
        if (s.src) sc.src = s.src;
        else sc.textContent = s.textContent;
        document.body.appendChild(sc);
      });
    } catch (renderErr) {
      console.error('Render error:', renderErr);
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const p = new URLSearchParams(window.location.search);
    if (p.has('logout')) {
      try {
        localStorage.removeItem('portal_auth_token');
        localStorage.removeItem('portal_user');
        sessionStorage.removeItem('portal_auth_token');
        sessionStorage.removeItem('portal_user');
      } catch (e) {}
      try {
        window.location.replace(getPortalBaseUrl() + '?logout=' + Date.now());
      } catch (e) {
        redirectToMainLogin(false);
      }
      return;
    }

    let savedToken = null;
    try {
      savedToken = localStorage.getItem('portal_auth_token') || sessionStorage.getItem('portal_auth_token');
    } catch (e) {}

    if (!savedToken) {
      redirectToMainLogin(false);
      return;
    }

    unlockCourseWithToken(savedToken);
  });
</script>
